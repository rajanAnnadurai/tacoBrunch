<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pick the egg taco photo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,400..700,0..100;1,9..144,400..700,0..100&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/site.css">
  <style>
    .picker-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: var(--s4);
    }
    @media (min-width: 760px) { .picker-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 1100px) { .picker-grid { grid-template-columns: repeat(5, 1fr); } }
    .picker-card {
      position: relative;
      background: white;
      border-radius: var(--r-md);
      overflow: hidden;
      box-shadow: 0 8px 24px -10px rgba(31,26,23,0.25);
    }
    .picker-card img {
      width: 100%;
      aspect-ratio: 4/5;
      object-fit: cover;
      display: block;
      background: var(--paper-warm);
    }
    .picker-letter {
      position: absolute;
      top: 10px;
      left: 10px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--rose);
      color: var(--paper);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--display);
      font-style: italic;
      font-size: 1.3rem;
      font-weight: 600;
      box-shadow: 0 4px 14px -4px rgba(0,0,0,0.4);
    }
    .picker-caption {
      padding: var(--s2) var(--s3);
      font-size: var(--fs-sm);
      color: var(--ink-soft);
      text-align: center;
    }
    .group-head {
      margin-top: var(--s7);
      margin-bottom: var(--s4);
      text-align: center;
    }
    .group-head h2 { margin: 0; font-size: var(--fs-2xl); }
    .group-head p { color: var(--ink-soft); margin-top: var(--s2); font-size: var(--fs-sm); }
  </style>
</head>
<body>

  <header class="page-hero">
    <div class="container">
      <span class="eyebrow">Egg taco photo · round 2</span>
      <h1>Pick a <em>shot</em>.</h1>
      <p class="meta">Fresh Unsplash candidates. Reply with the letter (A–J), or "none" and I'll search with different keywords.</p>
    </div>
  </header>

  <main>
    <section class="container container-wide">

      <div class="picker-grid">

        <div class="picker-card">
          <span class="picker-letter">A</span>
          <img src="https://images.unsplash.com/photo-1632370339733-759652742546?auto=format&fit=crop&w=600&h=750&q=85" alt="A">
          <div class="picker-caption">A</div>
        </div>

        <div class="picker-card">
          <span class="picker-letter">B</span>
          <img src="https://images.unsplash.com/photo-1632370339733-4896d407f6f9?auto=format&fit=crop&w=600&h=750&q=85" alt="B">
          <div class="picker-caption">B</div>
        </div>

        <div class="picker-card">
          <span class="picker-letter">C</span>
          <img src="https://images.unsplash.com/photo-1557366972-9c9f3ccc30f4?auto=format&fit=crop&w=600&h=750&q=85" alt="C">
          <div class="picker-caption">C</div>
        </div>

        <div class="picker-card">
          <span class="picker-letter">D</span>
          <img src="https://images.unsplash.com/photo-1634582825302-a8bc2a263a9a?auto=format&fit=crop&w=600&h=750&q=85" alt="D">
          <div class="picker-caption">D</div>
        </div>

        <div class="picker-card">
          <span class="picker-letter">E</span>
          <img src="https://images.unsplash.com/photo-1634582819714-5eb4df02c450?auto=format&fit=crop&w=600&h=750&q=85" alt="E">
          <div class="picker-caption">E</div>
        </div>

        <div class="picker-card">
          <span class="picker-letter">F</span>
          <img src="https://images.unsplash.com/photo-1592044903782-9836f74027c0?auto=format&fit=crop&w=600&h=750&q=85" alt="F">
          <div class="picker-caption">F</div>
        </div>

        <div class="picker-card">
          <span class="picker-letter">G</span>
          <img src="https://images.unsplash.com/photo-1626160199683-6f9993bee037?auto=format&fit=crop&w=600&h=750&q=85" alt="G">
          <div class="picker-caption">G</div>
        </div>

        <div class="picker-card">
          <span class="picker-letter">H</span>
          <img src="https://images.unsplash.com/photo-1598481309151-970fbcc3c89d?auto=format&fit=crop&w=600&h=750&q=85" alt="H">
          <div class="picker-caption">H</div>
        </div>

        <div class="picker-card">
          <span class="picker-letter">I</span>
          <img src="https://images.unsplash.com/photo-1776437208974-b4300ffcd811?auto=format&fit=crop&w=600&h=750&q=85" alt="I">
          <div class="picker-caption">I</div>
        </div>

        <div class="picker-card">
          <span class="picker-letter">J</span>
          <img src="https://images.unsplash.com/photo-1647545401834-39096eb7e4ad?auto=format&fit=crop&w=600&h=750&q=85" alt="J">
          <div class="picker-caption">J</div>
        </div>

      </div>

      <p style="margin-top: var(--s7); text-align: center; color: var(--ink-soft); font-style: italic; font-family: var(--display); font-size: var(--fs-lg);">
        Reply A–J. Or "none" and I'll keep searching.
      </p>
    </section>
  </main>

  <footer class="site-footer">
    <a href="index.html">← back to home</a>
  </footer>
</body>
</html>
