<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pick the egg taco photo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,400..700,0..100;1,9..144,400..700,0..100&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/site.css">
  <style>
    .picker-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: var(--s5);
    }
    @media (min-width: 760px) { .picker-grid { grid-template-columns: repeat(3, 1fr); } }
    .picker-card {
      position: relative;
      background: white;
      border-radius: var(--r-md);
      overflow: hidden;
      box-shadow: 0 8px 24px -10px rgba(31,26,23,0.25);
    }
    .picker-card img {
      width: 100%;
      aspect-ratio: 4/5;
      object-fit: cover;
      display: block;
    }
    .picker-letter {
      position: absolute;
      top: 12px;
      left: 12px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--rose);
      color: var(--paper);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--display);
      font-style: italic;
      font-size: 1.4rem;
      font-weight: 600;
      box-shadow: 0 6px 16px -6px rgba(0,0,0,0.4);
    }
    .picker-card.current .picker-letter {
      background: var(--ink);
    }
    .picker-card.current::after {
      content: "current";
      position: absolute;
      top: 12px;
      right: 12px;
      background: var(--ink);
      color: var(--paper);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 700;
    }
    .picker-caption {
      padding: var(--s3) var(--s4);
      font-size: var(--fs-sm);
      color: var(--ink-soft);
    }
  </style>
</head>
<body>

  <header class="page-hero">
    <div class="container">
      <span class="eyebrow">Egg taco photo · pick one</span>
      <h1>Which <em>shot</em>?</h1>
      <p class="meta">Reply with the letter that looks best — I'll swap it onto the home page and menu page.</p>
    </div>
  </header>

  <main>
    <section class="container container-wide">
      <div class="picker-grid">

        <div class="picker-card current">
          <span class="picker-letter">A</span>
          <img src="https://images.unsplash.com/photo-1611699363898-66fabe471e3c?auto=format&fit=crop&w=600&h=750&q=85" alt="Option A">
          <div class="picker-caption">A — currently live</div>
        </div>

        <div class="picker-card">
          <span class="picker-letter">B</span>
          <img src="https://images.unsplash.com/photo-1731090389654-f84a8d454046?auto=format&fit=crop&w=600&h=750&q=85" alt="Option B">
          <div class="picker-caption">B</div>
        </div>

        <div class="picker-card">
          <span class="picker-letter">C</span>
          <img src="https://images.unsplash.com/photo-1662478839528-a9c2db7e97b6?auto=format&fit=crop&w=600&h=750&q=85" alt="Option C">
          <div class="picker-caption">C</div>
        </div>

        <div class="picker-card">
          <span class="picker-letter">D</span>
          <img src="https://images.unsplash.com/photo-1644289450169-bc58aa16bacb?auto=format&fit=crop&w=600&h=750&q=85" alt="Option D">
          <div class="picker-caption">D</div>
        </div>

        <div class="picker-card">
          <span class="picker-letter">E</span>
          <img src="https://images.unsplash.com/photo-1607278967323-8766a3a501e6?auto=format&fit=crop&w=600&h=750&q=85" alt="Option E">
          <div class="picker-caption">E</div>
        </div>

        <div class="picker-card">
          <span class="picker-letter">F</span>
          <img src="https://images.unsplash.com/photo-1587569906338-f79d500d7122?auto=format&fit=crop&w=600&h=750&q=85" alt="Option F">
          <div class="picker-caption">F</div>
        </div>

      </div>

      <p style="margin-top: var(--s7); text-align: center; color: var(--ink-soft); font-style: italic; font-family: var(--display); font-size: var(--fs-lg);">
        Reply A, B, C, D, E, or F. If none look right, tell me and I'll fetch more.
      </p>
    </section>
  </main>

  <footer class="site-footer">
    <a href="index.html">← back to home</a>
  </footer>
</body>
</html>
